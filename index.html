<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    



    <!-- here are the styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <img src="assets/menu_icon.png">

        <div class="search">
            <img src="assets/search_icon.png" >
            <input type="text" placeholder="Quick find">
        </div>

        <div class="counter">
            <img src="assets/check_icon.png" >
            <span>30/5</span>
        </div>
    </header>

    <div class="container">
        <nav>
            <ul>
                <li>
                    <img src="assets/inbox_icon.png" >
                    <span>Inbox</span>
                    <span class="count">5</span>

                </li>
                <li>
                    <img src="assets/calendar_icon.png" >
                    <span>Today</span>
                    <span class="count">5</span>


                </li>
                <li>
                    <img src="assets/upcoming_icon.png" >
                    <span>Upcoming</span>

                </li>
            </ul>
        </nav>

        <main>

            <h1>Inbox</h1>
            <ul class="task-list">
                <li>
                    <input type="checkbox" >
                    <label >Call Mom</label>
                </li>
                <li>
                    <input type="checkbox" >
                    <label >Buy the new issue of Scientific American</label>
                </li>
                <li>
                    <input type="checkbox">
                    <label>Return the textbook to Josie</label>
                </li>
                <li>
                    <input type="checkbox" >
                    <label >Buy the new album by Rake</label>
                </li>
                <li>
                    <input type="checkbox" >
                    <label >Buy a gift card for Dad</label>
                </li>
            </ul>
        </main>
    </div>
</body>

</html>
